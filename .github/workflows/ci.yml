name: CI

on:
  pull_request:
  # Runs on main save the Rust and npm caches where every PR can restore them.
  # A PR's own caches are only visible to that PR.
  push:
    branches: [main]

# A new push to the same PR cancels the run it supersedes. Runs on main are
# never cancelled, so each merge saves its caches.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# macos-15 matches Will's machine. macos-latest has moved to macOS 26, whose web
# view behaves differently (RFC-001, "Repository and checks").
jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Installs the version pinned in rust-toolchain.toml, with its components.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The timing reports are reported in the job summary, never gating
  # (RFC-001). The demo songs' renders are a check, and fail the job: they
  # take minutes in a debug build, so `cargo test` skips them and they run
  # here, in release (RFC-009, "The demo song"). Its own job, so it runs
  # alongside the tests instead of after them.
  timing:
    name: Timing reports
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Installs the version pinned in rust-toolchain.toml, with its components.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: timing
      - name: Block timing report
        run: cargo test -p uta-engine --release --test timing -- --ignored --nocapture
      - name: Copy-on-write timing report
        run: cargo test -p uta-core --release --test timing -- --ignored --nocapture
      - name: Demo songs don't clip and have no silent track
        run: cargo test -p uta-song --release --test demos -- --ignored

  # The engine's tests again, built with RealtimeSanitizer: any allocation,
  # lock or system call inside a #[nonblocking] function aborts the run.
  # RTSAN_ENABLE makes rtsan-standalone download LLVM's prebuilt runtime.
  realtime:
    name: Real-time safety (RTSan)
    runs-on: macos-15
    env:
      RTSAN_ENABLE: "1"
    steps:
      - uses: actions/checkout@v5
      # Installs the version pinned in rust-toolchain.toml, with its components.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: rtsan
      - run: cargo test -p uta-engine -p uta-cli

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The token files are generated from DESIGN.md, and must match it.
      - name: Token files match DESIGN.md
        run: npm run tokens && git diff --exit-code -- src/design/tokens.css src/design/tokens.ts
      - run: npx designmd lint ../DESIGN.md
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  app:
    name: App build (tauri build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # Installs the version pinned in rust-toolchain.toml, with its components.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run tauri build -- --ci
      # The tuning panel is for development builds only (RFC-005, part 3).
      - name: No tuning panel in the release build
        run: npm run check:release
