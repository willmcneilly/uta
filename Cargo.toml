[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Tauri's recommended release settings: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The audio path is built optimised in dev builds too, so the dev app
# (`scripts/dev-app`, `tauri dev`) plays in real time: unoptimised, two or
# three Reverbs dropped out (UTA-109). Everything else,
# the app crate included, stays a quick debug build. Overflow checks and debug
# assertions stay on, so dev builds still catch what they're for. Performance
# is judged in release, never here. opt-level 3 was picked by its numbers in
# UTA-109's PR: no slower to rebuild or test than 1 or 2, and the fastest.
# `cargo test` uses these too (the test profile inherits dev's).
[profile.dev.package.uta-engine]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.dev.package.uta-core]
opt-level = 3
debug-assertions = true
overflow-checks = true

# The engine's audio dependencies: the lock-free queues and the device.
[profile.dev.package.rtrb]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3
