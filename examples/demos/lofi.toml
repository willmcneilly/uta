# The lo-fi song: a laid-back beat, mellow keys through a tape delay, and a
# round bass, at 80 BPM in F major. About a minute: a 4-bar ii-V-I-vi loop
# (Gm9, C13, Fmaj9, Dm9) that drops to a break on Bbmaj9 and comes back.
#
# It swings by hand, since the song file has no swing: every part steps in
# 1/32 triplets, twelve to a beat, and each off-beat eighth falls on the
# beat's eighth step instead of its seventh, one step late (a 58.3% swing).
name = "Lo-fi"
tempo = 80
arrangement = ["intro", "groove", "groove", "break", "groove", "outro"]

[master]
volume_db = 0

# Keys: the Bell, an FM electric piano's tine, played low as soft chords.
[[track]]
name = "Keys"
kind = "synth"
sound = "bell"
settings = { decay_seconds = 1.5, sustain = 0.25, release_seconds = 0.8 }
mixer = { volume_db = -3 }
effects = [{ delay = { sync = true, division = "1/8d", mode = "ping_pong", feedback = 0.4, low_cut_hz = 300, high_cut_hz = 2500, drive = 0.3, wobble = 0.35 }, mix = 0.3 }]
pattern.intro = { step = "1/32t", velocity = 70, notes = """
  Bb3+D4+F4+A4 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . |
  Bb3+D4+E4+A4 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . .""" }
pattern.groove = { step = "1/32t", velocity = 75, notes = """
  Bb3+D4+F4+A4 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . Bb3+D4+F4+A4 - - - - - - - - - - - . . . . . |
  Bb3+D4+E4+A4 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . Bb3+D4+E4+A4 - - - - - - - - - - - . . . . . |
  A3+C4+E4+G4 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . A3+C4+E4+G4 - - - - - - - - - - - . . . . . |
  F3+A3+C4+E4 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . F3+A3+C4+E4 - - - - - - - - - - - . . . . .""" }
pattern.break = { step = "1/32t", velocity = 65, notes = """
  D4+F4+A4+C5 - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . . . . . . . . . . . . . |
  C4+E4+G4+A4 - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . . . . . . . . . . . . . |
  Bb3+D4+F4+A4 - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . . . . . . . . . . . . . |
  Bb3+D4+F4+G4 - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . E4@60 - - - - - - . . . . .""" }
pattern.outro = { step = "1/32t", velocity = 70, notes = """
  Bb3+D4+F4+A4 - - - - - - - - - - - - - - - - - - - - - . . Bb3+D4+E4+A4 - - - - - - - - - - - - - - - - - - - - - . . |
  A3+C4+E4+G4 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -""" }

# Bass: roots and fifths under the chords, round, from F2 up. An octave
# lower, the Bass sound's sub falls to 22-25 Hz and the low notes buzz.
[[track]]
name = "Bass"
kind = "synth"
sound = "bass"
mixer = { volume_db = -9 }
pattern.groove = { step = "1/32t", notes = """
  G2 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . G2 - - - - D3 - - - - - - . . . . . |
  C3 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . C3 - - - - G2 - - - - - - . . . . . |
  F2 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . F2 - - - - C3 - - - - - - . . . . . |
  D3 - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . D3 - - - - A2 - - - - - - C3 - - . .""" }
pattern.break = { step = "1/32t", notes = """
  Bb2 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . |
  A2 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . |
  G2 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . . |
  C3 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - . . . . . . . . . . . .""" }
pattern.outro = { step = "1/32t", notes = """
  G2 - - - - - - - - - - - - - - - - - - - - - . . C3 - - - - - - - - - - - - - - - - - - - - - . . |
  F2 - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -""" }

# Drums: a soft boom-bap. A deep 808 kick, a low, loose snare and quiet
# swung eighth-note hats, each a little different, with ghost notes.
[[track]]
name = "Drums"
kind = "drums"
mixer = { volume_db = 6 }
settings.kick = { tune_hz = 50, tone = 0.15, decay_seconds = 0.4, level_db = 6 }
settings.snare = { tune_hz = 165, tone = 0.22, snappy = 0.4, level_db = 1 }
settings.closed_hat = { tone = 6000, decay_seconds = 0.04, level_db = 3 }
settings.open_hat = { decay_seconds = 0.25, level_db = -9 }

[track.pattern.intro]
step = "1/32t"
closed_hat = "x80......x55.... x75......x50.... x80......x55.... x70......x50.... | x80......x55.... x75......x50.... x80......x55.... x70.........x45."

[track.pattern.groove]
step = "1/32t"
kick       = "x........... ............ .......x.... ...x........ | x........... ............ .......x.... ............"
snare      = "............ x........... ............ x........... | ............ x........... ............ x.........x40."
closed_hat = "x90......x60.... x85......x55.... x92......x62.... x82......x50.... | x90......x58.... x85......x55.... x92......x60.... .......x60...."
open_hat   = "............ ............ ............ ............ | ............ ............ ............ x80..........."

[track.pattern.break]
step = "1/32t"
snare      = "............ x70........... ............ x70..........."
closed_hat = "x80......x55.... x75......x50.... x80......x55.... x70......x50...."

[[section]]
name = "intro"
bars = 2

[[section]]
name = "groove"
bars = 4

[[section]]
name = "break"
bars = 4

[[section]]
name = "outro"
bars = 2
