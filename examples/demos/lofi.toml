# The lo-fi song: a laid-back beat, mellow keys through a tape delay, and a
# round bass, at 80 BPM in F major. About a minute: a 4-bar ii-V-I-vi loop
# (Gm9, C13, Fmaj9, Dm9) that drops to a break on Bbmaj9 and comes back.
name = "Lo-fi"
tempo = 80
arrangement = ["intro", "groove", "groove", "break", "groove", "outro"]

[master]
volume_db = 0

# Keys: the Bell, an FM electric piano's tine, played low as soft chords.
[[track]]
name = "Keys"
kind = "synth"
sound = "bell"
settings = { decay_seconds = 1.5, sustain = 0.25, release_seconds = 0.8 }
mixer = { volume_db = -3 }
effects = [{ delay = { sync = true, division = "1/8d", mode = "ping_pong", feedback = 0.4, low_cut_hz = 300, high_cut_hz = 2500, drive = 0.3, wobble = 0.35 }, mix = 0.3 }]
pattern.intro = { notes = "Bb3+D4+F4+A4 - - - - - - - - - - - . . . . | Bb3+D4+E4+A4 - - - - - - - - - - - . . . .", velocity = 70 }
pattern.groove = { notes = """
  Bb3+D4+F4+A4 - - - - - . . . . Bb3+D4+F4+A4 - - - . . |
  Bb3+D4+E4+A4 - - - - - . . . . Bb3+D4+E4+A4 - - - . . |
  A3+C4+E4+G4 - - - - - . . . . A3+C4+E4+G4 - - - . . |
  F3+A3+C4+E4 - - - - - . . . . F3+A3+C4+E4 - - - . .""", velocity = 75 }
pattern.break = { notes = """
  D4+F4+A4+C5 - - - - - - - . . . . . . . . |
  C4+E4+G4+A4 - - - - - - - . . . . . . . . |
  Bb3+D4+F4+A4 - - - - - - - . . . . . . . . |
  Bb3+D4+F4+G4 - - - - - - - . . . . E4@60 - . .""", velocity = 65 }
pattern.outro = { notes = "Bb3+D4+F4+A4 - - - - - - . Bb3+D4+E4+A4 - - - - - - . | A3+C4+E4+G4 - - - - - - - - - - - - - - -", velocity = 70 }

# Bass: roots and fifths under the chords, low and round.
[[track]]
name = "Bass"
kind = "synth"
sound = "bass"
mixer = { volume_db = -4 }
pattern.groove = """
  G1 - - - - - . . . . G1 - D2 - . . |
  C2 - - - - - . . . . C2 - G1 - . . |
  F1 - - - - - . . . . F1 - C2 - . . |
  D2 - - - - - . . . . D2 - A1 - C2 ."""
pattern.break = """
  Bb1 - - - - - - - - - - - . . . . |
  A1 - - - - - - - - - - - . . . . |
  G1 - - - - - - - - - - - . . . . |
  C2 - - - - - - - - - - - . . . ."""
pattern.outro = "G1 - - - - - - . C2 - - - - - - . | F1 - - - - - - - - - - - - - - -"

# Drums: a soft boom-bap. A deep 808 kick, a low, loose snare and quiet
# eighth-note hats with ghost notes.
[[track]]
name = "Drums"
kind = "drums"
mixer = { volume_db = 6 }
settings.kick = { tune_hz = 50, tone = 0.15, decay_seconds = 0.4, level_db = 6 }
settings.snare = { tune_hz = 165, tone = 0.22, snappy = 0.4, level_db = 1 }
settings.closed_hat = { tone = 6000, decay_seconds = 0.04, level_db = 3 }
settings.open_hat = { decay_seconds = 0.25, level_db = -9 }
pattern.intro = { closed_hat = "x80.x55. x80.x55. x80.x55. x80.x55. | x80.x55. x80.x55. x80.x55. x80..x50" }
pattern.groove = { kick = "x... .... ..x. .x.. | x... .... ..x. ....", snare = ".... x... .... x... | .... x... .... x..x40", closed_hat = "x90.x60. x90.x60. x90.x60. x90.x60. | x90.x60. x90.x60. x90.x60. ..x60.", open_hat = ".... .... .... .... | .... .... .... x80..." }
pattern.break = { snare = ".... x70... .... x70... ", closed_hat = "x80.x55. x80.x55. x80.x55. x80.x55." }

[[section]]
name = "intro"
bars = 2

[[section]]
name = "groove"
bars = 4

[[section]]
name = "break"
bars = 4

[[section]]
name = "outro"
bars = 2
